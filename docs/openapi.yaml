openapi: 3.0.3
info:
  title: Budget Pulse Watch API
  version: 1.0.0
  description: |
    REST API for PRF Monitoring Dashboard. Includes authentication, PRF import, budgets, COA, and settings.
    Protected endpoints accept either:
      - Bearer JWT in the Authorization header, or
      - API Key via header `x-api-key: <token>`, or
      - API Key via header `Authorization: ApiKey <token>`
servers:
  - url: /
    description: Same origin
tags:
  - name: Health
  - name: Docs
  - name: Auth
  - name: Import
  - name: Settings
  - name: Upload
  - name: OCR
  - name: PRFs
  - name: Budgets
  - name: COA
  - name: PRF Files
  - name: PRF Documents
  - name: Cloud Sync
  - name: Users
  - name: LDAP
  - name: Reports
  - name: API Keys
  - name: Chat
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Provide API key directly in header: `x-api-key: <token>`
    ApiKeyAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Provide API key using custom Authorization scheme: `Authorization: ApiKey <token>`
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
    ChatReference:
      type: object
      required: [type, id, label, prfId, prfNo]
      properties:
        type: { type: string, enum: [prf, file] }
        id: { type: integer }
        label: { type: string }
        prfId: { type: integer }
        prfNo: { type: string }
        mimeType: { type: string }
        fileName: { type: string }
        previewUrl: { type: string }
        downloadUrl: { type: string }
    ChatAnswer:
      type: object
      required: [answer, references, model]
      properties:
        answer: { type: string }
        references:
          type: array
          items:
            $ref: '#/components/schemas/ChatReference'
        model: { type: string }
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, doccon, user]
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        department:
          type: string
        authType:
          type: string
          enum: [local, ldap]
        createdAt:
          type: string
          format: date-time
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          format: password
        authType:
          type: string
          enum: [auto, local, ldap]
          default: auto
    AuthLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    ValidationError:
      type: object
      properties:
        row:
          type: integer
        field:
          type: string
        message:
          type: string
        prfNo:
          type: string
          nullable: true
    ImportWarning:
      type: object
      properties:
        row:
          type: integer
        message:
          type: string
        prfNo:
          type: string
          nullable: true
    PRFValidation:
      type: object
      properties:
        success:
          type: boolean
        validRecords:
          type: integer
        invalidRecords:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportWarning'
    ImportResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        totalRecords:
          type: integer
        importedRecords:
          type: integer
        skippedRecords:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportWarning'
        totalPRFs:
          type: integer
          nullable: true
        successfulPRFs:
          type: integer
          nullable: true
        failedPRFs:
          type: integer
          nullable: true
    OCRSettings:
      type: object
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          enum: [gemini, openai]
        geminiApiKey:
          type: string
        openaiApiKey:
          type: string
        model:
          type: string
    UpdatePRFRequest:
      type: object
      description: Fields that can be updated on a PRF
      properties:
        Title: { type: string }
        Description: { type: string }
        Department: { type: string }
        COAID: { type: integer }
        RequestedAmount: { type: number, format: double }
        CurrencyCode: { type: string, enum: [IDR, USD] }
        ExchangeRateToIDR: { type: number, format: double }
        Priority: { type: string, enum: [Low, Medium, High, Critical] }
        Status: { type: string, description: Free-form status aligned with Pronto }
        RequiredDate: { type: string, format: date-time }
        ApprovedAmount: { type: number, format: double }
        ActualAmount: { type: number, format: double }
        ApprovalDate: { type: string, format: date-time }
        CompletionDate: { type: string, format: date-time }
        ApprovedBy: { type: integer, nullable: true }
        ApprovedByName: { type: string, nullable: true }
        Justification: { type: string }
        VendorName: { type: string }
        VendorContact: { type: string }
        Notes: { type: string }
        DateSubmit: { type: string, format: date-time }
        SubmitBy: { type: string }
        SumDescriptionRequested: { type: string }
        PurchaseCostCode: { type: string }
        RequiredFor: { type: string }
        BudgetYear: { type: integer }
    FolderTestRequest:
      type: object
      properties:
        path:
          type: string
    DedupeRequest:
      type: object
      properties:
        fix:
          type: boolean
          default: false
        prfNo:
          type: string
          nullable: true
        budgetYear:
          type: integer
          nullable: true
paths:
  /api/ocr-prf/rescan/{prfId}/file/{fileId}/preview:
    post:
      summary: Preview AI rescan for an existing PRF
      description: Reads a stored OCR Source or explicitly selected alternative PDF/image and returns item-level update/add proposals without changing PRF data. Shared merged-cell cost codes are repeated per item, visible strikethroughs are returned as selectable Cancelled proposals, and printed/extracted/cancelled/active totals are reconciled.
      tags: [OCR]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prfId
          required: true
          schema: { type: integer }
        - in: path
          name: fileId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Rescan preview with matching proposals, per-item status evidence, total reconciliation, and preserved existing items
        '400':
          description: Invalid source or request
        '404':
          description: PRF or selected source document not found
        '503':
          description: OCR service not configured

  /api/ocr-prf/rescan/{prfId}/file/{fileId}/apply:
    post:
      summary: Apply approved AI rescan proposals
      description: Atomically applies selected proposals from an OCR Source or alternative PDF/image, preserves unmatched items and active workflow statuses, applies selected visual-cancellation proposals as item-level overrides, uses the active-item total for an approved header update when cancellations exist, and records the exact source FileID in an audit snapshot.
      tags: [OCR]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prfId
          required: true
          schema: { type: integer }
        - in: path
          name: fileId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [extractedData, selectedIndexes]
              properties:
                extractedData:
                  type: object
                  additionalProperties: true
                selectedIndexes:
                  type: array
                  items: { type: integer }
                updateHeader:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Selected changes applied and audited
        '400':
          description: Invalid approval payload
        '404':
          description: PRF or selected source document not found

  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Missing parameters
  /api/auth/api-keys:
    post:
      summary: Create API key
      description: Create a new API key. Returns the plaintext token once.
      tags: [API Keys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name:
                  type: string
                role:
                  type: string
                  enum: [admin, doccon, user]
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
    get:
      summary: List API keys
      tags: [API Keys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
  /api/auth/api-keys/{id}:
    delete:
      summary: Deactivate API key
      tags: [API Keys]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
        '400':
          description: Invalid id
  /api/auth/verify:
    get:
      summary: Verify JWT token
      tags: [Auth]
      security:
        - bearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyAuthorization: []
      responses:
        '200':
          description: Valid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /api/auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      security:
        - bearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyAuthorization: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /api/import/prf/sheets:
    post:
      summary: List sheet names in uploaded Excel
      tags: [Import]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Sheet names
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sheets:
                        type: array
                        items:
                          type: string
        '400':
          description: No file uploaded
  /api/import/prf/validate:
    post:
      summary: Validate Excel file without importing
      tags: [Import]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                prfSheetName:
                  type: string
                budgetSheetName:
                  type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      filename:
                        type: string
                      fileSize:
                        type: integer
                      prfValidation:
                        $ref: '#/components/schemas/PRFValidation'
                      budgetValidation:
                        $ref: '#/components/schemas/PRFValidation'
                        nullable: true
                      summary:
                        type: object
                        properties:
                          totalPRFRecords:
                            type: integer
                          validPRFRecords:
                            type: integer
                          totalBudgetRecords:
                            type: integer
                          validBudgetRecords:
                            type: integer
                          totalErrors:
                            type: integer
                          totalWarnings:
                            type: integer
        '400':
          description: No file uploaded
  /api/import/prf/bulk:
    post:
      summary: Import PRF data from Excel
      tags: [Import]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                prfSheetName:
                  type: string
                budgetSheetName:
                  type: string
                skipDuplicates:
                  type: string
                  enum: ['true','false']
                updateExisting:
                  type: string
                  enum: ['true','false']
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: No file uploaded
  /api/import/prf/template:
    get:
      summary: Get PRF import template information
      tags: [Import]
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      headers:
                        type: array
                        items:
                          type: string
                      sampleData:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      instructions:
                        type: object
                        additionalProperties:
                          type: string
  /api/import/prf/history:
    get:
      summary: Get import history
      tags: [Import]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Import history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      imports:
                        type: array
                        items:
                          type: object
                          properties:
                            AuditID:
                              type: integer
                            Action:
                              type: string
                            ChangedBy:
                              type: integer
                            ChangedAt:
                              type: string
                              format: date-time
                            NewValues:
                              type: string
                            ChangedByName:
                              type: string
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          totalPages:
                            type: integer
                          hasNext:
                            type: boolean
                          hasPrev:
                            type: boolean
  /api/settings/ocr:
    get:
      summary: Get OCR settings (keys masked)
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OCR settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRSettings'
    post:
      summary: Save OCR settings
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCRSettings'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sharedFolderPath:
                    type: string
  /api/settings/general:
    get:
      summary: Get general settings
      tags: [Settings]
      responses:
        '200':
          description: General settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharedFolderPath:
                    type: string
    post:
      summary: Save general settings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sharedFolderPath:
                  type: string
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  sharedFolderPath:
                    type: string
  /api/settings/test-folder-path:
    post:
      summary: Test shared folder path accessibility
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderTestRequest'
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  fileCount:
                    type: integer
                  error:
                    type: string
  /api/settings/maintenance/dedupe-prf-items:
    post:
      summary: Remove duplicate PRF items
      tags: [Settings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DedupeRequest'
      responses:
        '200':
          description: Dedupe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  fix:
                    type: boolean
                  totalDuplicates:
                    type: integer
                  sampleCount:
                    type: integer
                  deleted:
                    type: integer
  /api/cloud-sync/prf/{prfNo}:
    post:
      summary: Sync a PRF to the shared OneDrive Excel
      tags: [Cloud Sync]
      description: Updates or appends a row in the configured workbook worksheet based on PRF No
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: prfNo
          required: true
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [single, scan]
            default: single
        - in: query
          name: year
          schema:
            type: integer
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      updated:
                        type: boolean
                      appended:
                        type: boolean
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: PRF not found
        '500':
          description: Internal error

  /api/docs/openapi.yaml:
    get:
      summary: Download OpenAPI specification
      tags: [Docs]
      responses:
        '200':
          description: OpenAPI YAML
          content:
            text/yaml:
              schema:
                type: string
        '404':
          description: OpenAPI spec not found

  /api/auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized

  /api/settings/ocr/test:
    post:
      summary: Test OCR provider configuration
      tags: [Settings]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/settings/ocr/key:
    get:
      summary: Reveal the decrypted OCR API key to an administrator
      description: Returns the selected provider key with no-store cache headers. The plaintext key must not be logged or persisted by clients.
      tags: [Settings]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: provider
          schema:
            type: string
            enum: [gemini, openai]
      responses:
        '200':
          description: Decrypted key for the selected provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey: { type: string }
                  provider: { type: string, enum: [gemini, openai] }
                  enabled: { type: boolean }
        '401': { description: Authentication required }
        '403': { description: Administrator access required }

  /api/upload/prf-document:
    post:
      summary: Upload and OCR-process PRF document
      tags: [Upload]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: OCR extraction result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: No file uploaded
        '401':
          description: Unauthorized
        '503':
          description: OCR not configured

  /api/upload/ocr/test:
    get:
      summary: Test OCR service
      tags: [Upload]
      responses:
        '200':
          description: Test response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/upload/ocr/status:
    get:
      summary: Get OCR service status
      tags: [Upload]
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/upload/cleanup/{uploadId}:
    delete:
      summary: Cleanup temporary upload files
      tags: [Upload]
      parameters:
        - in: path
          name: uploadId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cleanup result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/ocr-prf/create-from-document:
    post:
      summary: Create PRF from OCR document
      tags: [OCR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: PRF created from OCR
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: OCR output invalid
        '401':
          description: Unauthorized
        '409':
          description: PRF already exists
        '503':
          description: OCR not configured

  /api/ocr-prf/preview-extraction:
    post:
      summary: Preview OCR extraction (no PRF created)
      tags: [OCR]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
      responses:
        '200':
          description: OCR extraction preview
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: No file uploaded
        '401':
          description: Unauthorized
        '503':
          description: OCR not configured

  /api/chat/messages:
    post:
      summary: Ask a read-only question about all PRFs
      description: Uses fixed read-only tools over PRF/item data and attachment metadata. Attachment contents are not read, chat is not persisted by the backend, and OpenAI storage is disabled.
      tags: [Chat]
      security:
        - bearerAuth: []
        - ApiKeyHeader: []
        - ApiKeyAuthorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Assistant answer and application references
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/ChatAnswer'
        '400': { description: Invalid message history }
        '401': { description: Authentication required }
        '503': { description: OpenAI API key is not configured }

